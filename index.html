<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格探索測驗</title>
<style>
  :root {
    --bg: #EDE6D9;
    --surface: #FBF6EC;
    --surface-2: #F3EBDC;
    --rose: #C99A93;
    --rose-deep: #AD7D75;
    --camel: #B99B78;
    --camel-deep: #9C7F5C;
    --terracotta: #BC7357;
    --terracotta-deep: #9E5C42;
    --mauve: #9C7A78;
    --mauve-deep: #82605E;
    --ink: #453A33;
    --ink-soft: #776A5C;
    --line: #E0D3C1;
    --shadow: rgba(69, 58, 51, 0.14);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
    min-height: 100vh;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 260px; height: 260px; background: var(--rose); top: -90px; left: -90px; }
  body::after { width: 300px; height: 300px; background: var(--camel); bottom: -110px; right: -110px; }

  #app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 32px 22px 48px;
    display: flex;
    flex-direction: column;
  }

  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; animation: fadeUp .5s ease; }
  .screen-start { justify-content: center; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---- Start screen ---- */
  .start-decor { display: flex; justify-content: center; align-items: flex-end; gap: 14px; height: 100px; margin-bottom: 28px; }
  .decor-jar { border-radius: 16px 16px 8px 8px; border: 2px solid var(--line); }
  .decor-jar:nth-child(1) { width: 32px; height: 58px; background: var(--rose); }
  .decor-jar:nth-child(2) { width: 40px; height: 84px; background: var(--terracotta); }
  .decor-jar:nth-child(3) { width: 34px; height: 50px; background: var(--camel); }
  .decor-jar:nth-child(4) { width: 38px; height: 70px; background: var(--mauve); }

  .start-title { font-size: 30px; font-weight: 800; text-align: center; letter-spacing: 0.02em; margin-bottom: 12px; }
  .start-subtitle { font-size: 15px; color: var(--ink-soft); text-align: center; margin-bottom: 20px; padding: 0 8px; }
  .start-meta { font-size: 13px; color: var(--ink-soft); text-align: center; letter-spacing: 0.02em; margin-bottom: 36px; }
  .start-meta span { margin: 0 6px; white-space: nowrap; }

  .btn-primary {
    display: block; width: 100%; background: var(--terracotta); color: #FFF9F2;
    border: none; border-radius: 999px; padding: 17px 32px; font-size: 16px; font-weight: 700;
    cursor: pointer; box-shadow: 0 10px 24px var(--shadow); transition: transform .15s ease;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:focus-visible { outline: 3px solid var(--terracotta-deep); outline-offset: 3px; }

  .btn-secondary {
    display: block; width: 100%; background: transparent; color: var(--ink);
    border: 2px solid var(--line); border-radius: 999px; padding: 15px 32px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform .15s ease; font-family: inherit; margin-top: 12px;
  }
  .btn-secondary:active { transform: scale(0.97); }
  .btn-secondary:focus-visible { outline: 3px solid var(--terracotta-deep); outline-offset: 3px; }

  .btn-tertiary {
    display: block; width: 100%; background: none; border: none; color: var(--ink-soft);
    font-size: 14px; font-weight: 600; cursor: pointer; padding: 12px; font-family: inherit;
    margin-top: 4px; text-align: center;
  }
  .btn-tertiary:focus-visible { outline: 2px solid var(--terracotta-deep); outline-offset: 2px; border-radius: 6px; }

  /* ---- Question screen ---- */
  .q-progress { margin-bottom: 28px; }
  .q-progress-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .q-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rose), var(--terracotta)); border-radius: 999px; transition: width .4s ease; }
  .q-progress-text { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; text-align: right; }

  .q-card { background: var(--surface); border-radius: 24px; padding: 28px 22px; box-shadow: 0 6px 20px var(--shadow); margin-bottom: 20px; }
  .q-card.q-anim { animation: fadeUp .35s ease; }

  .q-text { font-size: 19px; font-weight: 600; line-height: 1.6; margin-bottom: 24px; min-height: 84px; display: flex; align-items: center; }

  .q-options { display: flex; flex-direction: column; }
  .opt-btn {
    width: 100%; padding: 14px 18px; margin-bottom: 10px; border: 2px solid var(--line);
    border-radius: 16px; background: var(--surface-2); color: var(--ink); font-size: 15px; font-weight: 500;
    text-align: left; cursor: pointer; font-family: inherit;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
  }
  .opt-btn:last-child { margin-bottom: 0; }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn.selected { background: var(--terracotta); border-color: var(--terracotta-deep); color: #FFF9F2; }
  .opt-btn:focus-visible { outline: 3px solid var(--terracotta-deep); outline-offset: 2px; }

  .q-back {
    background: none; border: none; color: var(--ink-soft); font-size: 14px; font-weight: 600;
    cursor: pointer; padding: 10px; align-self: flex-start; font-family: inherit;
  }
  .q-back:focus-visible { outline: 2px solid var(--terracotta-deep); outline-offset: 2px; border-radius: 6px; }

  /* ---- Result screen ---- */
  .result-header { text-align: center; margin-bottom: 8px; }
  .result-emoji { font-size: 52px; display: block; margin-bottom: 6px; animation: bounce 2.4s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .result-eyebrow { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.1em; text-align: center; margin-bottom: 4px; }
  .result-code { font-size: 44px; font-weight: 800; text-align: center; letter-spacing: 0.05em; color: var(--terracotta-deep); }
  .result-nickname { font-size: 21px; font-weight: 700; text-align: center; margin-top: 2px; }
  .result-tagline { font-size: 14px; color: var(--ink-soft); text-align: center; margin-top: 4px; margin-bottom: 20px; }

  .stilllife { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin: 8px 0 28px; padding: 16px 8px 20px; border-bottom: 2px solid var(--line); }
  .jar { display: flex; flex-direction: column; align-items: center; }
  .jar-body {
    width: 40px; height: 90px; background: var(--surface-2); border: 2px solid var(--line);
    border-radius: 16px 16px 8px 8px; overflow: hidden; display: flex; align-items: flex-end; margin-bottom: 8px;
  }
  .jar:nth-child(1) .jar-body { width: 36px; }
  .jar:nth-child(2) .jar-body { width: 44px; height: 96px; }
  .jar:nth-child(3) .jar-body { width: 38px; }
  .jar:nth-child(4) .jar-body { width: 42px; height: 84px; }
  .jar-fill { width: 100%; height: 0%; border-radius: 0 0 6px 6px; transition: height 1.1s cubic-bezier(0.22, 1, 0.36, 1); }
  .jar-label { font-size: 13px; font-weight: 700; }
  .jar-sublabel { font-size: 10px; color: var(--ink-soft); text-align: center; margin-top: 2px; max-width: 74px; }

  .result-desc { font-size: 15px; line-height: 1.75; text-align: center; margin-bottom: 24px; padding: 0 4px; }

  .info-card { background: var(--surface); border-radius: 20px; padding: 18px 20px; margin-bottom: 14px; border-left: 5px solid var(--rose); box-shadow: 0 4px 14px var(--shadow); }
  .info-card.watchouts { border-left-color: var(--terracotta); }
  .info-card.careers { border-left-color: var(--camel); }
  .info-card.compat { border-left-color: var(--mauve); }
  .info-card.celeb { border-left-color: var(--rose-deep); }

  .info-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .info-card ul { list-style: none; }
  .info-card li { font-size: 14px; padding-left: 18px; position: relative; margin-bottom: 6px; line-height: 1.6; }
  .info-card li::before { content: '·'; position: absolute; left: 4px; font-weight: 800; color: var(--ink-soft); }
  .info-card li:last-child { margin-bottom: 0; }
  .info-card p { font-size: 14px; line-height: 1.7; }

  .result-actions { margin-top: 20px; }
  .action-hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 8px; margin-bottom: 4px; }
  .copy-hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 10px; min-height: 16px; }
  .disclaimer { font-size: 11.5px; color: var(--ink-soft); text-align: center; line-height: 1.7; margin-top: 24px; padding: 0 8px; }

  .print-header { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (min-width: 640px) { #app { padding-top: 56px; } }
  @media (max-width: 360px) { .q-text { font-size: 17px; } .result-code { font-size: 38px; } }

  /* ---- Print / PDF report ---- */
  @page { margin: 1.5cm; }
  @media print {
    body::before, body::after { display: none; }
    #app { max-width: 100%; padding: 0; margin: 0; }
    .result-actions { display: none; }
    .disclaimer { margin-top: 20px; }
    .print-header { display: block; text-align: center; margin-bottom: 22px; }
    .print-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .print-date { font-size: 12px; color: var(--ink-soft); }
    .result-emoji { animation: none; }
    .q-card, .info-card { box-shadow: none; border: 1px solid var(--line); }
    .stilllife { box-shadow: none; }
    .info-card, .stilllife, .result-header { break-inside: avoid; }
  }
</style>
</head>

  </section>

</div>

  // ===================== State =====================
  var current = 0;
  var answers = [];
  var currentResultData = null;

  // ===================== Helpers =====================
  function $(id) { return document.getElementById(id); }

  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
    $('screen-' + name).classList.add('active');
  }

  // ===================== Test flow =====================
  function startTest() {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    showScreen('question');
    renderQuestion();
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    $('questionText').textContent = q.text;
    $('progressText').textContent = '第 ' + (current + 1) + ' 題 ／ ' + QUESTIONS.length;
    var pct = (current / QUESTIONS.length) * 100;
    $('progressFill').style.width = pct + '%';
    $('progressTrack').setAttribute('aria-valuenow', String(current));

    var optionsContainer = $('questionOptions');
    optionsContainer.innerHTML = '';
    var labels = ['非常不同意', '不同意', '普通', '同意', '非常同意'];
    labels.forEach(function (label, i) {
      var val = i + 1;
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.type = 'button';
      btn.textContent = label;
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', answers[current] === val ? 'true' : 'false');
      if (answers[current] === val) btn.classList.add('selected');
      btn.addEventListener('click', function () { selectAnswer(val); });
      optionsContainer.appendChild(btn);
    });

    $('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';

    var card = $('questionCard');
    card.classList.remove('q-anim');
    void card.offsetWidth;
    card.classList.add('q-anim');
  }

  function selectAnswer(val) {
    answers[current] = val;
    var opts = document.querySelectorAll('#questionOptions .opt-btn');
    opts.forEach(function (btn, i) {
      var isSelected = (i + 1) === val;
      btn.classList.toggle('selected', isSelected);
      btn.setAttribute('aria-checked', isSelected ? 'true' : 'false');
    });
    setTimeout(function () {
      if (current < QUESTIONS.length - 1) {
        current++;
        renderQuestion();
      } else {
        finishTest();
      }
    }, 280);
  }

  function goBack() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  }

  function finishTest() {
    var result = calculateResult();
    renderResult(result);
    showScreen('result');
  }

  function calculateResult() {
    var sums = { EI: { A: 0, B: 0 }, SN: { A: 0, B: 0 }, TF: { A: 0, B: 0 }, JP: { A: 0, B: 0 } };
    QUESTIONS.forEach(function (q, i) {
      sums[q.dim][q.pole] += answers[i];
    });
    var typeCode = '';
    var dims = [];
    DIM_ORDER.forEach(function (dim) {
      var a = sums[dim].A, b = sums[dim].B;
      var total = a + b;
      var pctA = Math.round((a / total) * 100);
      var pctB = 100 - pctA;
      var letterA = POLE_LETTER[dim].A;
      var letterB = POLE_LETTER[dim].B;
      var winnerLetter = a >= b ? letterA : letterB;
      var winnerPct = a >= b ? pctA : pctB;
      typeCode += winnerLetter;
      dims.push({ dim: dim, letterA: letterA, letterB: letterB, pctA: pctA, pctB: pctB, winnerLetter: winnerLetter, winnerPct: winnerPct });
    });
    return { typeCode: typeCode, dims: dims };
  }

  // ===================== Result rendering =====================
  function renderResult(result) {
    var profile = TYPES[result.typeCode];
    $('resultEmoji').textContent = profile.emoji;
    $('resultCode').textContent = result.typeCode;
    $('resultNickname').textContent = profile.nickname;
    $('resultTagline').textContent = profile.tagline;
    $('resultDescription').textContent = profile.description;

    var jarsContainer = $('jarsContainer');
    jarsContainer.innerHTML = '';
    result.dims.forEach(function (d) {
      var jar = document.createElement('div');
      jar.className = 'jar';
      var body = document.createElement('div');
      body.className = 'jar-body';
      var fill = document.createElement('div');
      fill.className = 'jar-fill';
      fill.style.height = '0%';
      fill.style.background = DIM_COLOR[d.dim];
      body.appendChild(fill);
      var label = document.createElement('div');
      label.className = 'jar-label';
      label.textContent = d.winnerLetter + ' ' + d.winnerPct + '%';
      var sublabel = document.createElement('div');
      sublabel.className = 'jar-sublabel';
      sublabel.textContent = POLE_NAME[d.letterA] + d.pctA + '% ・ ' + POLE_NAME[d.letterB] + d.pctB + '%';
      jar.appendChild(body);
      jar.appendChild(label);
      jar.appendChild(sublabel);
      jarsContainer.appendChild(jar);

      (function (fillEl, targetPct) {
        requestAnimationFrame(function () {
          setTimeout(function () { fillEl.style.height = targetPct + '%'; }, 100);
        });
      })(fill, d.winnerPct);
    });

    fillList('strengthsList', profile.strengths);
    fillList('watchoutsList', profile.watchouts);
    fillList('careersList', profile.careers);
    $('compatibilityText').textContent = profile.compatibility;
    $('celebritiesText').textContent = profile.celebrities.join('、');
    $('copyHint').textContent = '';
    $('printDate').textContent = '產生日期：' + formatDate(new Date());

    currentResultData = { typeCode: result.typeCode, profile: profile, dims: result.dims };
  }

  function formatDate(d) {
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }

  function fillList(id, items) {
    var el = $(id);
    el.innerHTML = '';
    items.forEach(function (item) {
      var li = document.createElement('li');
      li.textContent = item;
      el.appendChild(li);
    });
  }

  function buildResultText() {
    if (!currentResultData) return '';
    var typeCode = currentResultData.typeCode;
    var profile = currentResultData.profile;
    var dims = currentResultData.dims;
    var dimLines = dims.map(function (d) {
      return POLE_NAME[d.letterA] + '(' + d.letterA + ') ' + d.pctA + '% ／ ' + POLE_NAME[d.letterB] + '(' + d.letterB + ') ' + d.pctB + '%';
    }).join('\n');
    return '【我的 MBTI 測驗結果】\n' +
      '類型：' + typeCode + ' ' + profile.nickname + ' ' + profile.emoji + '\n\n' +
      dimLines + '\n\n' +
      profile.description + '\n\n' +
      '💪 優勢：' + profile.strengths.join('、') + '\n' +
      '⚠️ 留意：' + profile.watchouts.join('、') + '\n' +
      '💼 適合職業方向：' + profile.careers.join('、') + '\n' +
      '❤️ 人際／戀愛相容性：' + profile.compatibility + '\n' +
      '✨ 常被歸類為此型的名人（坊間看法，僅供參考）：' + profile.celebrities.join('、') + '\n\n' +
      '（本測驗結果僅供自我認識參考，並非正式心理診斷）';
  }

  function copyResult() {
    var text = buildResultText();
    var success = false;

    function fallbackCopy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        showCopyResult(ok);
      } catch (e) {
        showCopyResult(false);
      }
    }

    function showCopyResult(ok) {
      $('copyHint').textContent = ok ? '已複製，可以貼到你想保存的地方了 ✓' : '複製失敗，請手動選取文字複製';
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        showCopyResult(true);
      }).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function restartTest() {
    showScreen('start');
  }

  function downloadPDF() {
    if (!currentResultData) return;
    var originalTitle = document.title;
    document.title = 'MBTI測驗報告_' + currentResultData.typeCode;
    window.print();
    setTimeout(function () { document.title = originalTitle; }, 1000);
  }

  // ===================== Init =====================
  document.addEventListener('DOMContentLoaded', function () {
    $('startBtn').addEventListener('click', startTest);
    $('backBtn').addEventListener('click', goBack);
    $('pdfBtn').addEventListener('click', downloadPDF);
    $('copyBtn').addEventListener('click', copyResult);
    $('restartBtn').addEventListener('click', restartTest);
  });
})();
